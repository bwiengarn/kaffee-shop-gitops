apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: sealed-secrets, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/bitnami/sealed-secrets/tree/main/helm/sealed-secrets
    chart: Chart.yaml
    targetRevision: 2.19.3                       # Trainer: aktuelle Version prüfen
    helm: { releaseName: sealed-secrets }
  destination: { server: https://kubernetes.default.svc, namespace: kube-system }
  syncPolicy: { automated: { prune: true, selfHeal: true } }